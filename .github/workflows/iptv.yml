name: Omega IPTV Auto Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playlist.m3u'
      - 'index.html'
      - 'README.md'
      - 'parser.py'
      - 'checker.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Parser
        run: python parser.py

      - name: Run Checker
        run: python checker.py

      - name: Sanity check playlist
        run: |
          test -s playlist.m3u || { echo "::error::playlist.m3u не создан"; exit 1; }
          lines=$(wc -l < playlist.m3u)
          if [ "$lines" -lt 50 ]; then
            echo "::error::Плейлист подозрительно мал ($lines строк)"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in playlist.m3u index.html channels.json README.md; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d playlists ] && git add playlists/ || true

          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: auto-update IPTV [$(date -u +'%Y-%m-%d %H:%M UTC')] [skip ci]"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push failed, attempt $attempt — rebasing..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done

          echo "::error::Push failed after 3 attempts"
          exit 1

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.html playlist.m3u README.md public/
          [ -d playlists ] && cp -r playlists public/ || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - id: deployment
        uses: actions/deploy-pages@v4
