name: Omega IPTV Auto Pipeline

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playlist.m3u'
      - 'index.html'
      - 'README.md'
      - 'parser.py'
      - 'checker.py'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: iptv-pipeline
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Parser
        run: python parser.py

      - name: Run Checker
        run: python checker.py

      - name: Sanity check playlist
        run: |
          test -s playlist.m3u || { echo "::error::playlist.m3u не создан"; exit 1; }
          lines=$(wc -l < playlist.m3u)
          if [ "$lines" -lt 50 ]; then
            echo "::error::Плейлист подозрительно мал ($lines строк) — не коммитим"
            exit 1
          fi

      - name: Commit & push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Синхронизируемся с удаленным репозиторием, игнорируя локальные ветки
          git fetch origin ${{ github.ref_name }}
          git checkout -B ${{ github.ref_name }}
          
          # 2. Сбрасываем HEAD на последний коммит в удаленном репо. 
          # Наши только что сгенерированные файлы останутся в рабочей директории.
          git reset --soft origin/${{ github.ref_name }}

          # 3. Добавляем наши свежие файлы (они перезапишут старые в индексе)
          for f in playlist.m3u index.html channels.json README.md; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d playlists ] && git add playlists/ || true

          # 4. Проверяем, есть ли изменения
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # 5. Коммитим и пушим (на этот раз конфликтов быть не может)
          git commit -m "chore: auto-update IPTV [$(date -u +'%Y-%m-%d %H:%M UTC')] [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp index.html playlist.m3u README.md public/
          [ -d playlists ] && cp -r playlists public/ || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
